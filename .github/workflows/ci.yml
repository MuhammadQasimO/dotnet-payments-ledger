name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  build-and-test:
    name: build / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore PaymentsLedger.sln

      - name: Build (warnings-as-errors via Directory.Build.props)
        run: dotnet build PaymentsLedger.sln --configuration Release --no-restore

      - name: Unit + property tests
        run: dotnet test tests/PaymentsLedger.UnitTests/PaymentsLedger.UnitTests.csproj
             --configuration Release --no-build --logger "trx;LogFileName=unit.trx"
             --collect:"XPlat Code Coverage"

      - name: Integration tests (Testcontainers — Linux only, needs Docker daemon)
        if: matrix.os == 'ubuntu-latest'
        run: dotnet test tests/PaymentsLedger.IntegrationTests/PaymentsLedger.IntegrationTests.csproj
             --configuration Release --no-build --logger "trx;LogFileName=integration.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'

  format-check:
    name: format / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore PaymentsLedger.sln
      - run: dotnet format PaymentsLedger.sln --verify-no-changes --no-restore
